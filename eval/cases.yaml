# Requirement-style queries with the file(s) a developer would change. Written from the code at
# the refs in repos.txt, worded like tickets: business language, few or no exact identifiers.
# Each case searches its own project: several repos legitimately answer generic asks like "redirect".

# --- requests (Python)
- {project: requests, query: "reuse connections and retry when the network fails", expect: [src/requests/adapters.py]}
- {project: requests, query: "username and password login using basic or digest scheme", expect: [src/requests/auth.py]}
- {project: requests, query: "keep cookies and default settings between several calls to the same site", expect: [src/requests/sessions.py]}
- {project: requests, query: "drop credentials when a redirect goes to a different host", expect: [src/requests/sessions.py]}
- {project: requests, query: "header names should be looked up without caring about upper or lower case", expect: [src/requests/structures.py]}
- {project: requests, query: "throw an error when the server answers with a client or server failure code", expect: [src/requests/models.py]}
- {project: requests, query: "pick up proxy configuration from environment variables", expect: [src/requests/utils.py]}
- {project: requests, query: "one-line helpers to send get post put delete without creating a session", expect: [src/requests/api.py]}
- {project: requests, query: "error raised when the server takes too long to respond", expect: [src/requests/exceptions.py]}
- {project: requests, query: "look up numeric HTTP status by a readable name like not_found", expect: [src/requests/status_codes.py]}
- {project: requests, query: "callbacks that run after a response arrives", expect: [src/requests/hooks.py]}
- {project: requests, query: "cookie storage that also behaves like a dictionary", expect: [src/requests/cookies.py]}

