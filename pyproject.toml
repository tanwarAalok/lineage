[project]
name = "lineage"
version = "0.1.0"
description = "Cross-system code intelligence MCP server: code graph, hybrid search, term mapping."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=2.3,<3",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-language-pack>=1.22,<2",
    "sqlite-vec>=0.1.9,<0.2",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Real semantic embeddings. Without this, the zero-dependency `hash` embedder is used.
st = ["sentence-transformers>=3"]
# Store everything in the client's own Postgres (with pgvector) instead of a local SQLite file.
pg = ["psycopg[binary,pool]>=3.2"]
dev = ["pytest>=8", "psycopg[binary,pool]>=3.2", "pgserver>=0.1"]

[project.scripts]
lineage = "lineage.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineage = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
