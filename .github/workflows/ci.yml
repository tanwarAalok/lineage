name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only PyTorch: the default Linux wheel pulls a ~2 GB GPU build the tests never use.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q
  search-eval:
    # Search quality on pinned open-source repos (eval/repos.txt) with labelled queries (eval/cases.yaml).
    # Fails if a change makes ranking worse than the floor; scores are printed either way.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      # Baseline 2026-11-19: top10 0.978, top3 0.889, mrr 0.778 (45 queries). Floors leave room for ~2 queries.
      - run: eval/run.sh "$RUNNER_TEMP/lineage-eval" --min-top10 0.93 --min-mrr 0.72
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lineage .
      - run: docker run --rm lineage --help
